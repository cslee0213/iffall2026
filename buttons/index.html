<!DOCTYPE html>
<html>
	<head>
		
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<title>Buttons &mdash; Christine Lee</title>

		<link href='https://fonts.googleapis.com/css?family=Open+Sans:400,300,300italic,400italic,600,600italic,700,700italic,800,800italic' rel='stylesheet' type='text/css'>
		<link href='https://fonts.googleapis.com/css?family=Montserrat' rel='stylesheet' type='text/css'>
		<link href='https://fonts.googleapis.com/css?family=Ubuntu:700' rel='stylesheet' type='text/css'>
		<link rel="stylesheet" href="https://use.typekit.net/frl0muc.css">
		
		<style>

			body {
				color: #333;
				font-family: 'Open Sans', sans-serif;
				margin: 0;
				padding: 0;
			}

			main {
				margin: 40px;
			}

			h1 {
			 	font-size: 30px;
			 	margin-bottom: 40px;
			}

			.button_container {
				border: 1px solid #ddd;
				margin: 0 10px 10px 0;
				padding: 20px;
				width: 300px;
				height: 300px;
				float: left;
				overflow: hidden;
				box-sizing: border-box;
				text-align: center;
			}



			a#btn_garden {
				display: inline-flex;
				height: 70px;
				margin: auto;
				margin-top: 75px;
				align-items: center;
				background-image: url("garden.jpeg");
				background-size: contain;
				background-position: center;
				background-repeat: no-repeat;
				color: #fff8e8;
				border: 1px solid #a7bc91;
				border-radius: 50%;
				border: none;
				font-size: 14px;
				width: 200px;
				transform: .3s ease;
				position: relative;
				overflow: visible;
			}
			a#btn_garden:hover {
				transform: scale(1.1);
			}
			a#btn_garden::before, a#btn_garden::after {
				content: "";
				position: absolute;
				bottom: 0;
				width: 2px;
				height: 0;
				background: #527a43;
				transform-origin: bottom;
				transition: height 0.5s ease;
				z-index: 2;
				pointer-events: none;
			}

			a#btn_garden::before {
				left: 25%;
				transform: rotate(-25deg);
			}

			a#btn_garden::after {
				right: 25%;
				transform: rotate(25deg);
			}

			a#btn_garden:hover::before,
			a#btn_garden:hover::after {
				height: 55px;
			}
			a#btn_insta {
				position: relative;
				display: block;
				width: 100px;
				height: 100px;
				box-sizing: border-box;
				border-radius: 50%;
				background-size: contain;
				background-image: url("insta.png");
				background-position: center;
				background-repeat: no-repeat;
				margin: auto;
				margin-top: 75px;
				padding-top: 8px;
				color: #9f0303;
				border: black;
				overflow: hidden;
				transition: all 0.3s ease;
			}
			a#btn_insta::before {
				content: "";
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				border-radius: 50%;
				clip-path: circle(30%);
				background: linear-gradient(
					45deg,
					#feda75,
					#fa7e1e,
					#d62976,
					#962fbf,
					#4f5bd5
				);
				opacity: 0;
				transition: opacity 0.3s ease;
				pointer-events: none;
			}

			a#btn_insta:hover::before {
				opacity: 0.8;
				clip-path: circle(30%);
			}
			a#btn_insta:hover {
				box-shadow: 0 0 15px 5px rgba(214, 41, 118, 0.6);
			}

			a#btn_insta:hover::before {
				opacity: 0.8;
			}
			a#btn_ny {
				display: inline-block;
				height: 40px;
				box-sizing: border-box;
				border-radius: 4px;
				margin: auto;
				margin-top: 105px;
				border:solid  black;
				padding: 5px 30px 0px 30px;
				background-color: #ffffff;
				color: #000000;
				text-align: center;
				font-size: 18px;
				font-family: "adobe-caslon-pro", serif;
				font-weight: bold;
				text-decoration: none;
				position: relative;
				transition: letter-spacing 0.3s ease;
			}

			a#btn_ny::after {
				content: "";
				position: absolute;
				bottom: 0;
				left: 0;
				width: 0;
				height: 3px;
				background: #fd5261;
				transition: width 0.3s ease;
			}

			a#btn_ny:hover::after {
				width: 100%;
			}
			a#btn_ny:hover {
				letter-spacing: 3px;
			}
			a#btn_kittens {
				display: inline-block;
				position: relative;
				margin:auto;
				margin-top: 100px;
				padding: 8px 16px;
				background-color: #fff;
				color: #ebcb14;
				font-family: 'Ubuntu', sans-serif;
				font-size: 30px;
				font-weight: bold;
				text-transform: uppercase;
				text-decoration: none;
				letter-spacing: -2px;
				transition: all 0.2s ease;
			}
			a#btn_kittens:hover {
				animation: shake 0.4s ease;
				box-shadow: 0 0 20px #ff5722;
				color: red;
				background-color: yellow;
			}
			@keyframes shake {
				0% { transform: rotate(0deg); }
				25% { transform: rotate(-8deg); }
				50% { transform: rotate(8deg); }
				75% { transform: rotate(-5deg); }
				100% { transform: rotate(0deg); }
			}
			a#btn_nike {
				display: inline-block;
				position: relative;
				overflow: hidden;
				margin:auto;
				margin-top: 100px;
				padding: 8px 16px;
				background-color: #fff;
				color: #000000;
				font-family: Futura, sans-serif;
				font-size: 30px;
				font-weight: bold;
				text-transform: uppercase;
				text-decoration: none;
				letter-spacing: -2px;
				transition: all .3s ease;
			}
			a#btn_nike:hover {
				transform: skewX(-8deg) scale(1.1);
				box-shadow: 0 8px 0 rgba(0, 0, 0, 0.15);
			}
			a#btn_nike::before {
				content: "";
				position: absolute;
				top: 0;
				left: -100%;
				width: 60%;
				height: 100%;
				background: rgba(255, 255, 255, 0.35);
				transform: skewX(-25deg);
				transition: left 0.7s ease;
			}
			a#btn_nike:hover::before {
				left: 150%;
			}
		</style>
	</head>
	<body>
		
		<main>

			<h1>Button Styling &mdash; Christine Lee</h1>
			
			<div class="button_container">
				<a href="https://www.missouribotanicalgarden.org/" target="_blank" id="btn_garden"></a>
			</div>

			<div class="button_container">
				<a href="https://www.instagram.com/" target="_blank" id="btn_insta"><i class="fa fa-insta"></i></a>
			</div>

			<div class="button_container">
				<a href="http://www.newyorker.com/" target="_blank" id="btn_ny">New Yorker</a>
			</div>

			<div class="button_container">
				<a href="http://www.explodingkittens.com/" target="_blank" id="btn_kittens"><span>Exploding Kittens</span></a>
			</div>
            <div class="button_container">
				<a href="http://www.nike.com/us/en_us/" target="_blank" id="btn_nike"><span>Nike</span></a>
			</div>

		</main>	

	</body>
</html>
